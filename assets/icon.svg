      <stop offset="0" stop-color="#1e2129"/>
      <stop offset="1" stop-color="#121419"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- message bubble with an envelope -->
  <path d="M120 100 h272 a28 28 0 0 1 28 28 v178 a28 28 0 0 1 -28 28 h-176 l-58 46 v-46 h-38 a28 28 0 0 1 -28 -28 v-178 a28 28 0 0 1 28 -28 z" fill="#e8eaef"/>
  <rect x="150" y="140" width="212" height="148" rx="18" fill="none" stroke="#9aa1ae" stroke-width="14"/>
  <path d="M160 156 l96 70 l96 -70" fill="none" stroke="#9aa1ae" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- split send pill -->
